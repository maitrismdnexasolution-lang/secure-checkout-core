[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Public (browser-safe) backend identifiers only.
  # Never add SUPABASE_SERVICE_ROLE_KEY or RAZORPAY_KEY_SECRET here — those are
  # server-only and must be set in the Netlify UI (Site settings → Environment).
  VITE_SUPABASE_URL = "https://oqxmqlbwiwdlvdmfpvmf.supabase.co"
  VITE_SUPABASE_PROJECT_ID = "oqxmqlbwiwdlvdmfpvmf"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_U-v6O0G6WfCQCOzyBQxxdA_tHAiJGGt"



[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell must never be cached long-term, otherwise returning visitors
# keep running an old bundle after every deploy. Hashed assets above stay immutable.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"





[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
